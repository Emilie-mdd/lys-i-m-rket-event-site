<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formular | Eventnavn</title>
    <link rel="stylesheet" href="./starter.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" type="image/png" href="../favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg" />
    <link rel="shortcut icon" href="../favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="../favicon/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  </head>

  <body>
    <header class="site-header">
      <div class="header-content">
        <a class="site-logo" href="./">Lys i mørket</a>
        <nav class="site-nav">
          <button>Menu</button>
          <ul class="menu" id="menu" popover>
            <li><a href="./">Forside</a></li>
            <li><a href="./svg.html">Interaktiv SVG</a></li>
            <li><a href="./form.html" aria-current="page">Formular</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="form-page">
        <header class="form-intro">
          <h1>Tilmelding</h1>
          <h2>Vær med til at lyse vintermørket op.</h2>
          <p>Tilmeld dig en aften med hyggelige oplevelser, 
            kreativ udfoldelse og små lysglimt, der samler os.</p>
        </header>

        <!-- Formularen samler felterne og sender oplysningerne til opsamlingssiden -->
        <form class="form-placeholder" action="./opsamling.html" method="get">
          <!-- Navn -->
          <div>
            <label for="navn">Fulde navn</label>
            <input type="text" id="navn" name="navn" required />
          </div>
          <!-- E-mail -->
          <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required />
          </div>
          <!-- Antal deltagere -->
          <div>
            <label for="deltagere">Antal deltagere</label>
            <input type="number" id="deltagere" name="deltagere" min="1" max="10" value="1" required />
          </div>
          <!-- Valg af dekoration: Fieldset samler valgmulighederne, og legend giver gruppen en overskrift -->
          <fieldset>
            <legend>Hvad vil du gerne dekorere?</legend>

            <!-- Radio-knapper gør det muligt kun at vælge én mulighed -->
            <label for="eget-glas">
              <input type="checkbox" id="eget-glas" name="dekoration" value="eget-glas" required />
              Mit eget medbragte glas
            </label>

            <label for="genbrugt-glas">
              <input type="checkbox" id="genbrugt-glas" name="dekoration" value="genbrugt-glas" />
              Jeg vil gerne købe et glas
            </label>

            <label for="lanterne">
              <input type="checkbox" id="lanterne" name="dekoration" value="lanterne" />
              Jeg vil gerne købe en vandlanterne
            </label>

            <label for="ingen">
              <input type="checkbox" id="ingen" name="dekoration" value="ingen" />
              Jeg vil ikke dekorere noget
            </label>
          </fieldset>

          <!-- Checkbox: Brugeren skal acceptere betingelserne -->
          <label for="betingelser">
            <input type="checkbox" id="betingelser" name="betingelser" value="accepteret" required />
            Jeg accepterer eventets betingelser
          </label>

          <!-- Submit-knap: Sender formularens oplysninger videre -->
          <button type="submit">Tilmeld</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <p>Eventnavn</p>
        <p>Footer</p>
      </div>
    </footer>
    <script src="./script.js"></script>
  </body>
</html>
